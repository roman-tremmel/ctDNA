# Configuration for the LINE-1 aneuploidy (mFAST-SeqS-style) pipeline.
# Copy this file, fill in the paths/sequences for your assay, and pass it
# to scripts/run_pipeline.sh / the individual scripts with --config.

reference:
  # bwa index PREFIX (the path you'd pass to `bwa mem`), not necessarily a
  # literal .fasta file - bwa mem only needs prefix.{amb,ann,bwt,pac,sa}
  # (+.alt if present), so an existing site-wide/HPC-shared index works
  # directly, e.g. an iGenomes GATK GRCh38 BWAIndex:
  #   /path/to/BWAIndex/Homo_sapiens_assembly38.fasta.64
  # Otherwise, run `bwa index genome.fa` once and point this at genome.fa.
  # Either way, make sure its contig naming (chr1, chr2, ... vs 1, 2, ...)
  # matches resources/chrom_arms.hg38.bed and line1_bed below - GATK's
  # GRCh38 bundle uses "chr"-prefixed names, matching this repo's BEDs.
  fasta: resources/genome.fa
  # Chromosome-arm coordinates, see resources/build_chrom_arms_bed.py
  chrom_arms_bed: resources/chrom_arms.hg38.bed
  # LINE-1 element loci, see resources/build_line1_bed.sh
  line1_bed: resources/line1_elements.hg38.bed

primer:
  # LINE-1 locus-specific forward primer core, extracted from Verschoor
  # et al. 2023 Supplementary Table 1 ("Primers for mFAST-SeqS"): all 8
  # forward-primer spacer-length variants share this sequence as their
  # 3' (right-anchored) end - see resources/primers_supplementary_table1.tsv
  # for the full table and derivation.
  forward_seq: "ACACAGGGAGGGGAACAT"
  # Fadrosh et al. 2014-style heterogeneity spacer: a variable-length run
  # of bases (here: genomic 5' extensions of the primer, not random N's -
  # see resources/primers_supplementary_table1.tsv) inserted before the
  # locus-specific primer to increase base diversity for low-complexity
  # amplicon libraries on Illumina instruments. Observed spacer lengths in
  # Supplementary Table 1: 0, 2, 3, 4, 5, 6, 7, 8 nt.
  spacer_min_len: 0
  spacer_max_len: 8
  # cutadapt error tolerance when locating the primer (fraction of primer length)
  max_error_rate: 0.15

alignment:
  threads: 4
  min_mapq: 30          # drop ambiguous/multi-mapping reads
  min_read_length: 20   # drop reads too short to map uniquely after trimming

qc:
  min_total_reads: 20000  # paper's assay target was >=90,000 reads/sample

# Arms excluded from the aneuploidy score: acrocentric short arms (too few
# LINE-1 elements to quantify reliably) and chrY.
excluded_arms:
  - chr13p
  - chr14p
  - chr15p
  - chr21p
  - chr22p
  - chrYp
  - chrYq

score:
  # Aneuploidy score cutoff used in Verschoor et al. 2023 / Belic et al. 2016
  high_cutoff: 5.0
