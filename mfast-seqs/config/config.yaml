# Configuration for the LINE-1 aneuploidy (mFAST-SeqS-style) pipeline.
# Copy this file, fill in the paths/sequences for your assay, and pass it
# to scripts/run_pipeline.sh / the individual scripts with --config.

reference:
  # bwa-indexed reference genome (run `bwa index genome.fa` once)
  fasta: resources/genome.fa
  # Chromosome-arm coordinates, see resources/build_chrom_arms_bed.py
  chrom_arms_bed: resources/chrom_arms.hg38.bed
  # LINE-1 element loci, see resources/build_line1_bed.sh
  line1_bed: resources/line1_elements.hg38.bed

primer:
  # LINE-1 locus-specific forward primer used in PCR1. This is assay-specific
  # (see the assay's own supplementary methods / Belic et al. 2016) and is
  # NOT reproduced here - fill in your real primer sequence before running.
  forward_seq: "REPLACE_WITH_REAL_L1_PRIMER_SEQUENCE"
  # Fadrosh et al. 2014 dual-indexing heterogeneity spacer: a random-length
  # run of bases inserted between the sequencing adapter/index and the
  # locus-specific primer to increase base diversity for low-complexity
  # amplicon libraries on Illumina instruments.
  spacer_min_len: 0
  spacer_max_len: 7
  # cutadapt error tolerance when locating the primer (fraction of primer length)
  max_error_rate: 0.15

alignment:
  threads: 4
  min_mapq: 30          # drop ambiguous/multi-mapping reads
  min_read_length: 20   # drop reads too short to map uniquely after trimming

qc:
  min_total_reads: 20000  # paper's assay target was >=90,000 reads/sample

# Arms excluded from the aneuploidy score: acrocentric short arms (too few
# LINE-1 elements to quantify reliably) and chrY.
excluded_arms:
  - chr13p
  - chr14p
  - chr15p
  - chr21p
  - chr22p
  - chrYp
  - chrYq

score:
  # Aneuploidy score cutoff used in Verschoor et al. 2023 / Belic et al. 2016
  high_cutoff: 5.0
