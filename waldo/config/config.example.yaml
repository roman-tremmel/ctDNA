# Configuration for the WALDO-style within-sample aneuploidy pipeline.
#
# DO NOT edit this file in place. It's a tracked template - editing it
# directly means your site-specific paths fight every future `git pull`.
# Copy it OUTSIDE the git clone once and edit the copy - see
# ../README.md's "How to run" for the full copy-pasteable sequence.
# Use absolute paths below - scripts don't assume any particular
# working directory.

reference:
  # bwa index PREFIX (the path you'd pass to `bwa mem`), not necessarily a
  # literal .fasta file - an existing site-wide/HPC-shared index (e.g. an
  # iGenomes GATK GRCh38 BWAIndex: .../BWAIndex/Homo_sapiens_assembly38.fasta.64)
  # works directly. See ../mfast-seqs/config/config.example.yaml for the
  # same note.
  fasta: /path/to/BWAIndex/Homo_sapiens_assembly38.fasta.64
  # Both ship with this repo (static, deterministic, read-only) - point at
  # your clone's copies.
  chrom_arms_bed: /path/to/ctDNA-repo/waldo/resources/chrom_arms.hg38.bed
  windows_bed: /path/to/ctDNA-repo/waldo/resources/windows.500kb.hg38.bed
  # YOU generate this one (needs a UCSC download), into your external
  # rundir - never into the git clone (see ../README.md "How to run").
  line1_bed: /path/to/your/rundir/resources/line1_elements.hg38.bed

primer:
  # Same LINE-1 assay family as mfast-seqs/ (FAST-SeqS, Kinde et al. 2012).
  # Defaulted here to the LINE-1-specific core extracted from Verschoor
  # et al. 2023 Supplementary Table 1 (see
  # resources/primers_supplementary_table1.tsv) - the "modified FAST-SeqS"
  # variant. Douville et al. 2018 (the WALDO paper) cite using their own
  # previously-described primers (Kinde et al. 2012) amplifying ~38,000
  # LINE-1 loci; that paper's own Supplementary primer sequence was not
  # available while building this and may differ from the value below -
  # replace it if/when you have WALDO's own primer sequence confirmed.
  forward_seq: "ACACAGGGAGGGGAACAT"
  spacer_min_len: 0
  spacer_max_len: 8
  max_error_rate: 0.15

alignment:
  threads: 4
  min_mapq: 30
  min_read_length: 20

qc:
  min_total_reads: 20000

clustering:
  # Per Douville et al. 2018 SI Methods: a window's cluster = other
  # windows (on DIFFERENT chromosomes) whose reference-panel read depth
  # is not significantly different in mean (paired t-test) or variance
  # (F-test). The paper found 7 reference samples sufficient.
  mean_p_threshold: 0.05
  var_p_threshold: 0.05
  min_reference_samples: 7

calibration:
  # Outlier trimming when estimating each window's within-sample cluster
  # mean/variance (call_aneuploidy.py), and the margin added to a
  # reference panel's observed max/min Z when calibrating per-arm
  # thresholds (calibrate_threshold.py) - both values as used in the paper.
  outlier_p_threshold: 0.01
  margin: 4.0

excluded_arms:
  - chr13p
  - chr14p
  - chr15p
  - chr21p
  - chr22p
  - chrYp
  - chrYq

score:
  # Fallback flat |Z| cutoff if you haven't run calibrate_threshold.py yet.
  # Prefer a calibrated per-arm threshold table - see waldo/README.md.
  arm_z_cutoff: 3.0
